name: Release

# Publishing a GitHub release vX.Y.Z publishes the storefront image at that version (ADR 0001;
# commerce-storefront#2 REQ-018), one stage after another, so a failure stops everything after it:
#   1. version: the tag is vX.Y.Z and points at a commit on main;
#   2. image: every installed package and the amd64 image are scanned with Grype at high, with no
#      allowlist (arm64 is the same output on the same base); then amd64 and arm64 are pushed with an
#      SBOM and provenance, and the image is attested.
# Rerunning a release is safe: a version already on GHCR is never pushed again, so its digest and
# attestation stay as they were. The pull request's Fragment job rehearses this build (make rehearse).
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/reference-systems-lab/commerce-storefront

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tags must point at a commit on main; $GITHUB_SHA is not"
            exit 1
          fi

  image:
    name: Image
    needs: [version]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The job's token is also the build's npm secret, so `npm ci` runs with a token that can write
    # packages. Accepted: no install script runs and nuxt build has no network (D-21).
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # sign the attestation
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: existing
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "$IMAGE:$VERSION is already published as $digest; not pushing it again"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build every installed package for scanning (the deps stage, not pushed)
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: deps
          platforms: linux/amd64
          load: true
          tags: commerce-storefront-deps:scan
          secrets: npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Scan every installed package with Grype (fails on a high finding)
        if: steps.existing.outputs.digest == ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: commerce-storefront-deps:scan
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Build the image for scanning (amd64, not pushed)
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: commerce-storefront:scan
          secrets: npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Scan the image with Grype (fails on a high finding)
        if: steps.existing.outputs.digest == ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: commerce-storefront:scan
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Build and push amd64 and arm64, with an SBOM and provenance
        if: steps.existing.outputs.digest == ''
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: org.opencontainers.image.version=${{ env.VERSION }}
          secrets: npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Attest the image's build provenance
        if: steps.existing.outputs.digest == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
        run: echo "Image \`$IMAGE:$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
