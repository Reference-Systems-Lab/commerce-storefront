# CI only: the pinned Playwright browsers, sharing storefront-web's network so they browse
# http://localhost:3000, a trustworthy origin like the platform's HTTPS one (commerce-storefront#2 S5).
# The checkout is mounted read-only; its node_modules come from npm ci on the runner.
services:
  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    profiles: [checks]
    network_mode: service:storefront-web
    user: pwuser
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    shm_size: 1gb # Chromium's shared memory
    tmpfs: ["/tmp:size=512m,mode=1777"]
    working_dir: /work
    environment:
      HOME: /tmp
      BASE_URL: http://localhost:3000
      PLAYWRIGHT_OUTPUT_DIR: /tmp/test-results
    volumes:
      - {
          type: bind,
          source: ..,
          target: /work,
          read_only: true,
          bind: { create_host_path: false },
        }
