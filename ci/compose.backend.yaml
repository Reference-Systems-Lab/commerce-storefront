# The backend's wiring, as the platform's compose/compose.backend.yaml sets it: the v0.1.2 image by
# digest, the networks and the start order.
services:
  backend-migrate:
    image: ghcr.io/reference-systems-lab/commerce-backend:0.1.2@sha256:a8abbec28249f27d75989ca508b65e268b484bb42e3049d674a169b096f28171
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  backend-api:
    image: ghcr.io/reference-systems-lab/commerce-backend:0.1.2@sha256:a8abbec28249f27d75989ca508b65e268b484bb42e3049d674a169b096f28171
    networks: [data, edge]
    depends_on:
      backend-migrate: { condition: service_completed_successfully }
