# The backend's wiring, as the platform's compose/compose.backend.yaml sets it: the v0.1.1 image by
# digest, the networks and the start order.
services:
  backend-migrate:
    image: ghcr.io/reference-systems-lab/commerce-backend:0.1.1@sha256:9856144cf27707b7bac41994bd4e2d48fc20af7b1d4e3076a94c8d6fc36da550
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  backend-api:
    image: ghcr.io/reference-systems-lab/commerce-backend:0.1.1@sha256:9856144cf27707b7bac41994bd4e2d48fc20af7b1d4e3076a94c8d6fc36da550
    networks: [data, edge]
    depends_on:
      backend-migrate: { condition: service_completed_successfully }
