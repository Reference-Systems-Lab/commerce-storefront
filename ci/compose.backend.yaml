# The backend's wiring, as the platform's compose/compose.backend.yaml sets it: the v0.1.0 image by
# digest, the networks and the start order.
services:
  backend-migrate:
    image: ghcr.io/reference-systems-lab/commerce-backend:0.1.0@sha256:3e17e6003767524951a0626cdfd9452fcfa51f746cac9eff88cbb0ea42660505
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  backend-api:
    image: ghcr.io/reference-systems-lab/commerce-backend:0.1.0@sha256:3e17e6003767524951a0626cdfd9452fcfa51f746cac9eff88cbb0ea42660505
    networks: [data, edge]
    depends_on:
      backend-migrate: { condition: service_completed_successfully }
