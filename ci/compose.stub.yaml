# A stand-in for the platform (commerce-platform compose.yaml, ADR 0002), so the storefront runs the
# way the platform runs it: Postgres, the backend's own fragment at its v0.1.0 release with the
# platform's wiring, and, from compose.wiring.yaml, the storefront's fragment. Both networks are
# internal, as on the platform, so nothing here can reach the internet; development publishes the API
# through compose.dev.yaml, and CI checks from a container on `edge`. The backend's commit, its
# comment and the image in compose.backend.yaml move together (make lint checks).
name: commerce-storefront-ci

include:
  - path:
      - https://github.com/Reference-Systems-Lab/commerce-backend.git#929b6f17e44e6eb5cc60b1e5faf2f23a46bbc921:compose.platform.yaml # v0.1.0
      - compose.backend.yaml
    env_file: backend.env

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    environment:
      POSTGRES_USER: commerce
      POSTGRES_DB: commerce
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    networks: [data]
    tmpfs:
      [
        "/tmp:size=64m",
        "/var/run/postgresql:uid=999,gid=999,size=1m",
        "/var/lib/postgresql:uid=999,gid=999",
      ]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "commerce", "-d", "commerce"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

networks:
  edge:
    internal: true
  data:
    internal: true

secrets:
  postgres_password:
    file: ${CI_SECRETS_DIR:?}/postgres_password
